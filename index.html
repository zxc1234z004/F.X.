<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊帳務透明系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 配置區 ---
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZ5IpQpZ-rK50hPeMh3t4VJTdcZeENbipV8xs8bLvRpynhcYJtV5QJWg6nDFZbgsHhWA/exec"; 

        // 封裝 Lucide 圖標組件以便在 React 中使用
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [view, setView] = useState('home'); 
            const [searchQuery, setSearchQuery] = useState(''); 
            const [memberData, setMemberData] = useState(null); 
            const [allMembersData, setAllMembersData] = useState([]); 
            const [accountingData, setAccountingData] = useState([]); 
            const [isLoading, setIsLoading] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [error, setError] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);

            // 管理員狀態
            const [isAdmin, setIsAdmin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            // 表單狀態
            const [formData, setFormData] = useState({
                type: 'accounting',
                date: new Date().toISOString().split('T')[0],
                category: '月助收入',
                description: '',
                amount: '',
                handler: '',
                memberId: '',
                memberName: '',
                year: new Date().getFullYear().toString(),
                month: (new Date().getMonth() + 1).toString(),
                status: '已繳',
                paymentMethod: '現金' 
            });

            const formatDisplayDate = (dateStr) => {
                if (!dateStr || dateStr === '-') return dateStr;
                try {
                    const date = new Date(dateStr);
                    if (isNaN(date.getTime())) return dateStr;
                    return date.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
                } catch (e) { return dateStr; }
            };

            useEffect(() => {
                if (view === 'admin_view' || view === 'home' || view === 'admin_yearly') fetchAccounting();
                if (view === 'admin_reports' || ((view === 'admin_entry' || view === 'admin_yearly') && isAdmin)) {
                    fetchAllMembers();
                }
            }, [view, isAdmin]);

            const fetchAccounting = async () => {
                if (!GAS_WEB_APP_URL) return;
                setIsLoading(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getAccounting`);
                    const result = await response.json();
                    if (result.success) setAccountingData(result.data);
                } catch (err) { setError("讀取流水帳失敗"); }
                finally { setIsLoading(false); }
            };

            const fetchAllMembers = async () => {
                if (!GAS_WEB_APP_URL) return;
                setIsLoading(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getAllMembers`);
                    const result = await response.json();
                    if (result.success) setAllMembersData(result.data);
                } catch (err) { setError("讀取成員列表失敗"); }
                finally { setIsLoading(false); }
            };

            const uniqueMembers = useMemo(() => {
                const memberMap = new Map();
                allMembersData.forEach(m => {
                    if (m.MemberID && !memberMap.has(m.MemberID)) {
                        memberMap.set(m.MemberID, m.Name);
                    }
                });
                return Array.from(memberMap.entries()).map(([id, name]) => ({ id, name }));
            }, [allMembersData]);

            const yearlyAnalytics = useMemo(() => {
                const targetYear = Number(selectedYear);
                const monthlyTrend = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, income: 0, expense: 0 }));
                const categories = {};

                accountingData.forEach(item => {
                    const itemDate = new Date(item.Date);
                    if (itemDate.getFullYear() === targetYear) {
                        const monthIdx = itemDate.getMonth();
                        const amt = Number(item.Amount || 0);
                        if (amt > 0) monthlyTrend[monthIdx].income += amt;
                        else monthlyTrend[monthIdx].expense += Math.abs(amt);
                        const cat = item.Category || "其他";
                        categories[cat] = (categories[cat] || 0) + amt;
                    }
                });

                const contributorMap = {};
                allMembersData.forEach(m => {
                    if (Number(m.Year) === targetYear && m.Status === '已繳') {
                        contributorMap[m.Name] = (contributorMap[m.Name] || 0) + 1;
                    }
                });
                const topContributors = Object.entries(contributorMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
                const maxVal = Math.max(...monthlyTrend.map(d => Math.max(d.income, d.expense)), 1000);

                return { monthlyTrend, categories, topContributors, maxVal };
            }, [accountingData, allMembersData, selectedYear]);

            const reportStats = useMemo(() => {
                const monthlyData = {};
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1;
                const START_YEAR = 2026;
                const START_MONTH = 1;
                
                const paidSet = new Set();
                allMembersData.forEach(m => {
                    if (m.Status === '已繳') {
                        paidSet.add(`${m.MemberID}-${m.Year}-${m.Month}`);
                        const key = `${m.Year}-${m.Month}`;
                        if (!monthlyData[key]) monthlyData[key] = { collected: 0, count: 0 };
                        monthlyData[key].collected += Number(m.Amount || 0);
                        monthlyData[key].count += 1;
                    }
                });

                const autoDetectedUnpaid = [];
                uniqueMembers.forEach(member => {
                    for (let y = START_YEAR; y <= currentYear; y++) {
                        const mStart = (y === START_YEAR) ? START_MONTH : 1;
                        const mEnd = (y === currentYear) ? currentMonth : 12;
                        for (let m = mStart; m <= mEnd; m++) {
                            const checkKey = `${member.id}-${y}-${m}`;
                            if (!paidSet.has(checkKey)) {
                                autoDetectedUnpaid.push({ MemberID: member.id, Name: member.name, Year: y, Month: m, Amount: 500, Reason: "漏繳偵測" });
                            }
                        }
                    }
                });

                return { 
                    monthlyData, 
                    unpaidList: autoDetectedUnpaid.sort((a, b) => (b.Year * 12 + b.Month) - (a.Year * 12 + a.Month)) 
                };
            }, [allMembersData, uniqueMembers]);

            const stats = useMemo(() => {
                const targetYear = Number(selectedYear);
                const filtered = accountingData.filter(item => new Date(item.Date).getFullYear() === targetYear);
                const income = filtered.filter(i => i.Amount > 0).reduce((a, b) => a + Number(b.Amount), 0);
                const expense = filtered.filter(i => i.Amount < 0).reduce((a, b) => a + Math.abs(Number(b.Amount)), 0);
                return { income, expense, balance: income - expense };
            }, [accountingData, selectedYear]);

            const handleSearch = async () => {
                if (!searchQuery.trim() || !GAS_WEB_APP_URL) return;
                setIsLoading(true);
                setMemberData(null);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=queryMember&query=${encodeURIComponent(searchQuery)}`);
                    const result = await response.json();
                    if (result.success) setMemberData(result.data);
                    else setError("查詢失敗");
                } catch (err) { setError("連線錯誤"); }
                finally { setIsLoading(false); }
            };

            const handleAdminLogin = () => {
                if (passwordInput === "1234") { 
                    setIsAdmin(true); 
                    setShowLoginModal(false); 
                    setPasswordInput(''); 
                } else { 
                    setError("密碼錯誤"); 
                }
            };

            const handleSubmitEntry = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const action = formData.type === 'accounting' ? 'addAccounting' : 'addMemberRecord';
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, ...formData, password: "1234" })
                    });
                    setSuccessMsg("提交成功");
                    setTimeout(() => { 
                        setSuccessMsg(null); 
                        setView(formData.type === 'accounting' ? 'admin_view' : 'admin_reports'); 
                    }, 2000);
                } catch (err) { setError("提交失敗"); }
                finally { setIsLoading(false); }
            };

            const NavButton = ({ id, label, icon }) => (
                <button 
                    onClick={() => { 
                        if ((id === 'admin_entry' || id === 'admin_yearly') && !isAdmin) {
                            setShowLoginModal(true);
                        } else {
                            setView(id); 
                            setIsMenuOpen(false); 
                            setError(null); 
                        }
                    }}
                    className={`flex items-center gap-3 px-5 py-3 rounded-2xl transition-all duration-300 font-bold ${
                        view === id ? 'bg-blue-600 text-white shadow-lg' : id === 'admin_entry' ? 'text-blue-600 bg-blue-50 hover:bg-blue-100' : 'text-slate-500 hover:bg-slate-100'
                    }`}
                >
                    <Icon name={icon} /><span>{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-100 selection:text-blue-700">
                    
                    {/* 登入 Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-6">
                            <div className="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl scale-in-center">
                                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6">
                                    <Icon name="lock" size={32} />
                                </div>
                                <h3 className="text-2xl font-black mb-2">管理員驗證</h3>
                                <p className="text-slate-500 mb-6 font-medium">請輸入密碼以存取受保護的功能。</p>
                                <input 
                                    type="password" autoFocus placeholder="輸入密碼" 
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                                    className="w-full px-6 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-600 outline-none mb-4 font-bold"
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setShowLoginModal(false)} className="flex-1 py-4 font-bold text-slate-400">取消</button>
                                    <button onClick={handleAdminLogin} className="flex-1 bg-blue-600 text-white rounded-2xl font-black shadow-xl">驗證</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-blue-600 p-2 rounded-xl text-white">
                                    <Icon name="trending-up" size={22} />
                                </div>
                                <span className="font-black text-xl tracking-tight text-slate-800">團隊帳務<span className="text-blue-600">管理</span></span>
                            </div>
                            <div className="hidden lg:flex items-center gap-1">
                                <NavButton id="home" label="總覽" icon="wallet" />
                                <NavButton id="member_query" label="月助查詢" icon="search" />
                                <NavButton id="admin_view" label="收支明細" icon="file-text" />
                                <NavButton id="admin_reports" label="自動對帳" icon="history" />
                                <NavButton id="admin_yearly" label="年度報告" icon="bar-chart-3" />
                                <div className="w-px h-6 bg-slate-200 mx-2"></div>
                                <NavButton id="admin_entry" label="帳務登錄" icon="plus-circle" />
                            </div>
                            <button className="lg:hidden p-2 text-slate-600" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} size={24} />
                            </button>
                        </div>
                        {isMenuOpen && (
                            <div className="lg:hidden absolute top-full left-0 w-full bg-white border-b border-slate-200 p-6 flex flex-col gap-2 shadow-2xl">
                                <NavButton id="home" label="總覽" icon="wallet" />
                                <NavButton id="member_query" label="月助查詢" icon="search" />
                                <NavButton id="admin_view" label="收支明細" icon="file-text" />
                                <NavButton id="admin_reports" label="自動對帳" icon="history" />
                                <NavButton id="admin_yearly" label="年度報告" icon="bar-chart-3" />
                                <NavButton id="admin_entry" label="管理登錄" icon="plus-circle" />
                            </div>
                        )}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        {successMsg && <div className="mb-6 p-4 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center gap-2 text-emerald-600 font-bold"><Icon name="check-circle" /> {successMsg}</div>}
                        {error && <div className="mb-6 p-4 bg-rose-50 border border-rose-100 rounded-2xl flex items-center justify-between text-rose-600 font-bold shake"><div className="flex items-center gap-2"><Icon name="alert-circle" /> {error}</div><button onClick={() => setError(null)}><Icon name="x" size={18} /></button></div>}
                        
                        {view === 'home' && (
                            <div className="space-y-8">
                                <div className="bg-slate-900 rounded-[2.5rem] p-12 text-white shadow-2xl relative overflow-hidden">
                                    <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-8">
                                        <div><p className="text-slate-400 mb-2">{selectedYear} 年度累計結餘</p><h2 className="text-6xl font-black tabular-nums">${stats.balance.toLocaleString()}</h2></div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div className="bg-white/5 p-5 rounded-2xl border border-white/10">
                                                <p className="text-emerald-400 text-xs font-bold uppercase mb-1">總收入</p>
                                                <p className="text-2xl font-bold">+{stats.income.toLocaleString()}</p>
                                            </div>
                                            <div className="bg-white/5 p-5 rounded-2xl border border-white/10">
                                                <p className="text-rose-400 text-xs font-bold uppercase mb-1">總支出</p>
                                                <p className="text-2xl font-bold">-{stats.expense.toLocaleString()}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    <div onClick={() => setView('member_query')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-blue-500 cursor-pointer shadow-sm transition-all"><Icon name="search" size={32} className="mb-4 text-blue-600"/><h3 className="font-black text-2xl mb-2">個人查詢</h3><p className="text-slate-500">輸入姓名或 ID 查詢年度繳費狀況。</p></div>
                                    <div onClick={() => setView('admin_reports')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-rose-500 cursor-pointer shadow-sm transition-all"><Icon name="history" size={32} className="mb-4 text-rose-600"/><h3 className="font-black text-2xl mb-2">自動對帳</h3><p className="text-slate-500">智能偵測 2026 年起的漏繳月份。</p></div>
                                    <div onClick={() => setView('admin_yearly')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-indigo-500 cursor-pointer shadow-sm transition-all"><Icon name="bar-chart-3" size={32} className="mb-4 text-indigo-600"/><h3 className="font-black text-2xl mb-2">年度分析</h3><p className="text-slate-500">掌握全年度資金波動與成員貢獻。</p></div>
                                </div>
                            </div>
                        )}

                        {view === 'member_query' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 p-8 md:p-10">
                                    <h2 className="text-3xl font-black mb-8 flex items-center gap-3"><Icon name="search" size={32} className="text-blue-600" /> 個人查詢</h2>
                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <input type="text" placeholder="輸入 ID 或 姓名" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSearch()} className="flex-1 pl-6 pr-6 py-5 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-600 outline-none font-bold text-lg" />
                                        <button onClick={handleSearch} disabled={isLoading} className="bg-blue-600 text-white px-10 py-5 rounded-2xl font-black shadow-xl">立即查詢</button>
                                    </div>
                                </div>
                                {memberData && memberData.length > 0 && (
                                    <div className="space-y-4">
                                        <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 rounded-3xl text-white shadow-xl flex justify-between items-center">
                                            <h3 className="text-3xl font-black">{memberData[0].Name} <span className="text-sm opacity-70">({memberData[0].MemberID})</span></h3>
                                            <div className="bg-white/20 rounded-2xl px-6 py-3 border border-white/20"><p className="text-2xl font-black">{memberData.length} 筆紀錄</p></div>
                                        </div>
                                        {memberData.map((item, idx) => (
                                            <div key={idx} className="bg-white p-6 rounded-2xl border border-slate-200 flex justify-between items-center hover:shadow-md transition-all">
                                                <div className="flex items-center gap-5">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${item.Status === '已繳' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}`}>
                                                        <Icon name={item.Status === '已繳' ? "check-circle" : "clock"} size={28} />
                                                    </div>
                                                    <div><div className="font-black text-xl">{item.Year}年 {item.Month}月份</div><div className="text-xs text-slate-400 mt-1">更新日期：{formatDisplayDate(item.Date)}</div></div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-2xl font-black">${Number(item.Amount).toLocaleString()}</div>
                                                    <div className="text-xs font-bold text-slate-400">{item.PaymentMethod || "現金"}</div>
                                                    <div className={`text-sm font-bold ${item.Status === '已繳' ? 'text-emerald-600' : 'text-amber-600'}`}>{item.Status}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'admin_view' && (
                            <div className="space-y-6">
                                <div className="flex justify-between items-end">
                                    <h2 className="text-4xl font-black text-slate-800">收支明細</h2>
                                    <button onClick={fetchAccounting} className="p-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-all shadow-sm">
                                        <Icon name="refresh-ccw" className={isLoading ? 'animate-spin text-blue-600' : 'text-slate-600'} />
                                    </button>
                                </div>
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50 border-b border-slate-100">
                                                <tr>
                                                    <th className="px-8 py-5 text-xs font-black uppercase text-slate-400">日期</th>
                                                    <th className="px-8 py-5 text-xs font-black uppercase text-slate-400">交易項目</th>
                                                    <th className="px-8 py-5 text-xs font-black uppercase text-slate-400 text-right">金額</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {accountingData.map((row, idx) => (
                                                    <tr key={idx} className="hover:bg-blue-50/30 transition-colors">
                                                        <td className="px-8 py-6 font-black">{formatDisplayDate(row.Date)}</td>
                                                        <td className="px-8 py-6">
                                                            <div className="flex items-center gap-2">
                                                                <span className="px-2 py-0.5 rounded border border-slate-200 text-[10px] font-black uppercase tracking-widest bg-slate-50">{row.Category}</span>
                                                                <span className="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase tracking-tighter">{row.PaymentMethod || "現金"}</span>
                                                            </div>
                                                            <div className="text-sm font-bold mt-1.5 text-slate-700">{row.Description}</div>
                                                        </td>
                                                        <td className={`px-8 py-6 text-right font-black text-xl tabular-nums ${row.Amount > 0 ? 'text-emerald-600' : 'text-rose-500'}`}>
                                                            {row.Amount > 0 ? `+${Number(row.Amount).toLocaleString()}` : Number(row.Amount).toLocaleString()}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin_reports' && (
                            <div className="space-y-8">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-3xl font-black flex items-center gap-3"><Icon name="history" size={32} className="text-blue-600" /> 漏繳自動追蹤系統</h2>
                                        <p className="text-slate-500 font-medium mt-1">比對名冊與紀錄，自動列出缺失月份。</p>
                                    </div>
                                    <button onClick={fetchAllMembers} className="flex items-center gap-2 px-6 py-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 font-bold shadow-sm transition-all">
                                        <Icon name="refresh-ccw" size={18} className={isLoading ? 'animate-spin' : ''} />
                                        <span>更新偵測數據</span>
                                    </button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
                                        <p className="text-slate-400 text-xs font-black uppercase mb-2">偵測漏繳人次</p>
                                        <h4 className="text-4xl font-black text-rose-500">{reportStats.unpaidList.length} <span className="text-sm font-normal text-slate-400">筆</span></h4>
                                    </div>
                                    <div className="md:col-span-2 bg-white p-6 rounded-3xl border border-slate-200 shadow-sm overflow-x-auto">
                                        <p className="text-slate-400 text-xs font-black uppercase mb-4">月助實收統計</p>
                                        <div className="flex gap-4">
                                            {Object.entries(reportStats.monthlyData).sort().slice(-6).map(([month, data]) => (
                                                <div key={month} className="bg-slate-50 rounded-2xl p-4 border border-slate-100 flex-1 text-center min-w-[100px]">
                                                    <p className="text-[10px] font-bold text-slate-400 mb-1">{month}</p>
                                                    <p className="text-lg font-black text-blue-600">${data.collected.toLocaleString()}</p>
                                                    <p className="text-[10px] text-slate-400">已收 {data.count} 人</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
                                    <div className="bg-rose-50 px-8 py-5 border-b border-rose-100 flex justify-between items-center">
                                        <h3 className="font-black text-rose-700 flex items-center gap-2"><Icon name="alert-circle" /> 2026 年度漏繳清單</h3>
                                        <span className="text-xs bg-rose-200 text-rose-700 px-3 py-1 rounded-full font-bold">待補金額: ${reportStats.unpaidList.length * 500}</span>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left">
                                            <thead className="bg-slate-50/50 border-b border-slate-100">
                                                <tr>
                                                    <th className="px-8 py-4 text-xs font-black text-slate-400 uppercase">成員編號 / 姓名</th>
                                                    <th className="px-8 py-4 text-xs font-black text-slate-400 uppercase text-center">缺失月份</th>
                                                    <th className="px-8 py-4 text-xs font-black text-slate-400 uppercase text-right">狀態說明</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {reportStats.unpaidList.length > 0 ? reportStats.unpaidList.map((row, idx) => (
                                                    <tr key={idx} className="hover:bg-rose-50/20 transition-colors">
                                                        <td className="px-8 py-5">
                                                            <div className="font-black text-slate-800">{row.Name}</div>
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase">{row.MemberID}</div>
                                                        </td>
                                                        <td className="px-8 py-5 text-center">
                                                            <span className="px-3 py-1 bg-white text-rose-600 border border-rose-100 rounded-lg text-xs font-black">{row.Year}年 {row.Month}月</span>
                                                        </td>
                                                        <td className="px-8 py-5 text-right font-black text-slate-400 text-xs italic">{row.Reason}</td>
                                                    </tr>
                                                )) : (
                                                    <tr><td colSpan="3" className="px-8 py-20 text-center text-slate-400 font-bold">目前資料庫完整，無漏繳。</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin_yearly' && (
                            <div className="space-y-8">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h2 className="text-4xl font-black flex items-center gap-3"><Icon name="bar-chart-3" size={36} className="text-blue-600" /> {selectedYear} 年度財務報告</h2>
                                        <p className="text-slate-500 font-medium mt-1">全年度資金流向分析與成員貢獻統計</p>
                                    </div>
                                    <div className="flex items-center gap-3 bg-white p-2 rounded-2xl border shadow-sm w-full md:w-auto">
                                        <Icon name="calendar" size={18} className="text-slate-400 ml-2" />
                                        <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-transparent font-black text-slate-700 outline-none pr-4">
                                            <option value="2026">2026 年度</option>
                                            <option value="2025">2025 年度</option>
                                            <option value="2024">2024 年度</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-slate-900 rounded-[2rem] p-8 text-white shadow-xl relative overflow-hidden">
                                        <p className="text-slate-400 text-xs font-bold uppercase mb-2">年度結餘</p>
                                        <h4 className="text-4xl font-black tabular-nums">${stats.balance.toLocaleString()}</h4>
                                    </div>
                                    <div className="bg-white rounded-[2rem] p-8 border shadow-sm border-slate-200">
                                        <p className="text-slate-400 text-xs font-bold uppercase mb-2">年度總收入</p>
                                        <h4 className="text-4xl font-black text-emerald-600 tabular-nums">+${stats.income.toLocaleString()}</h4>
                                    </div>
                                    <div className="bg-white rounded-[2rem] p-8 border shadow-sm border-slate-200">
                                        <p className="text-slate-400 text-xs font-bold uppercase mb-2">年度總支出</p>
                                        <h4 className="text-4xl font-black text-rose-500 tabular-nums">-${stats.expense.toLocaleString()}</h4>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-2 bg-white rounded-[2.5rem] p-8 md:p-10 border border-slate-200 shadow-sm">
                                        <h3 className="text-xl font-black flex items-center gap-2 mb-10"><Icon name="calendar" className="text-blue-600" /> 月度收支趨勢</h3>
                                        <div className="h-64 flex items-end justify-between gap-2 md:gap-4 px-2">
                                            {yearlyAnalytics.monthlyTrend.map((d, i) => (
                                                <div key={i} className="flex-1 flex flex-col items-center group relative h-full">
                                                    <div className="w-full flex items-end justify-center gap-0.5 h-full">
                                                        <div style={{ height: `${(d.income / yearlyAnalytics.maxVal) * 100}%` }} className="w-full max-w-[12px] bg-blue-600 rounded-t-sm transition-all hover:opacity-80"></div>
                                                        <div style={{ height: `${(d.expense / yearlyAnalytics.maxVal) * 100}%` }} className="w-full max-w-[12px] bg-slate-200 rounded-t-sm transition-all hover:opacity-80"></div>
                                                    </div>
                                                    <span className="text-[10px] font-black text-slate-400 mt-3">{d.month}月</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-gradient-to-br from-amber-50 to-orange-50 rounded-[2.5rem] p-8 border border-amber-100 shadow-sm h-full text-center">
                                        <Icon name="award" size={48} className="text-amber-500 mx-auto mb-4" />
                                        <h3 className="text-xl font-black mb-6">年度榮譽貢獻</h3>
                                        <div className="space-y-4 text-left">
                                            {yearlyAnalytics.topContributors.map(([name, count], i) => (
                                                <div key={i} className="flex justify-between items-center bg-white/60 p-3 rounded-xl border border-amber-200">
                                                    <span className="font-black">{name}</span>
                                                    <span className="text-xs font-black text-amber-600">已繳 {count} 次</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'admin_entry' && (
                            <div className="max-w-2xl mx-auto space-y-6">
                                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-200 p-10 text-slate-800">
                                    <div className="flex justify-between mb-8">
                                        <h2 className="text-3xl font-black flex items-center gap-3"><Icon name="plus-circle" className="text-blue-600" size={32} /> 新增紀錄</h2>
                                        <div className="flex bg-slate-100 p-1 rounded-xl">
                                            <button onClick={()=>setFormData({...formData,type:'accounting'})} className={`px-4 py-2 rounded-lg text-sm font-bold ${formData.type==='accounting'?'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>流水帳</button>
                                            <button onClick={()=>setFormData({...formData,type:'member'})} className={`px-4 py-2 rounded-lg text-sm font-bold ${formData.type==='member'?'bg-white shadow-sm text-blue-600':'text-slate-400'}`}>月助</button>
                                        </div>
                                    </div>
                                    <form onSubmit={handleSubmitEntry} className="space-y-5">
                                        <div className="grid grid-cols-2 gap-5">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">日期</label>
                                                <input type="date" required value={formData.date} onChange={(e)=>setFormData({...formData,date:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold border-none outline-none focus:ring-2 focus:ring-blue-600 transition-all" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">類別 / 週期</label>
                                                {formData.type === 'accounting' ? (
                                                    <select value={formData.category} onChange={(e)=>setFormData({...formData,category:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600"><option>月助收入</option><option>個人了愿</option><option>外部捐款</option><option>行政支出</option><option>活動支出</option></select>
                                                ) : (
                                                    <div className="flex gap-2">
                                                        <input type="number" placeholder="年" value={formData.year} onChange={(e)=>setFormData({...formData,year:e.target.value})} className="w-1/2 px-4 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600" />
                                                        <select value={formData.month} onChange={(e)=>setFormData({...formData,month:e.target.value})} className="w-1/2 px-4 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600">
                                                            {Array.from({length:12},(_,i)=>i+1).map(m=><option key={m} value={m}>{m}月</option>)}
                                                        </select>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                        {formData.type === 'member' && (
                                            <div className="grid grid-cols-2 gap-5">
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">成員編號</label>
                                                    <select required value={formData.memberId} onChange={(e)=>{const m=uniqueMembers.find(i=>i.id===e.target.value);setFormData({...formData,memberId:e.target.value,memberName:m?m.name:''});}} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600"><option value="">選擇成員</option>{uniqueMembers.map(m=><option key={m.id} value={m.id}>{m.id} ({m.name})</option>)}<option value="NEW">新成員</option></select>
                                                </div>
                                                <div className="space-y-1">
                                                    <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">姓名</label>
                                                    <input type="text" placeholder="姓名" required value={formData.memberName} onChange={(e)=>setFormData({...formData,memberName:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600" readOnly={formData.memberId!=='NEW'}/>
                                                </div>
                                            </div>
                                        )}
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">項目說明</label>
                                            <input type="text" placeholder="請輸入說明" required value={formData.description} onChange={(e)=>setFormData({...formData,description:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600" />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">金額</label>
                                                <input type="number" placeholder="金額" required value={formData.amount} onChange={(e)=>setFormData({...formData,amount:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold text-xl outline-none border border-transparent focus:border-blue-600" />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">繳錢方式</label>
                                                <select value={formData.paymentMethod} onChange={(e)=>setFormData({...formData, paymentMethod: e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600"><option>現金</option><option>郵局</option><option>轉帳</option><option>LinePay</option></select>
                                            </div>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-1">經手人</label>
                                            <input type="text" placeholder="經手人" required value={formData.handler} onChange={(e)=>setFormData({...formData,handler:e.target.value})} className="w-full px-5 py-4 bg-slate-50 rounded-xl font-bold outline-none border border-transparent focus:border-blue-600" />
                                        </div>
                                        <button type="submit" disabled={isLoading} className="w-full bg-blue-600 text-white py-5 rounded-2xl font-black text-xl shadow-xl shadow-blue-200 hover:bg-blue-700 transition-all active:scale-95 disabled:opacity-50">
                                            {isLoading ? "提交中..." : "儲存資料"}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="mt-20 py-16 border-t border-slate-200 text-center text-slate-400 text-sm font-bold uppercase tracking-widest">© 2026 團隊智能財務系統</footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
