<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢賢帳務系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        /* 美化滾動條 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 配置區 ---
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxZ5IpQpZ-rK50hPeMh3t4VJTdcZeENbipV8xs8bLvRpynhcYJtV5QJWg6nDFZbgsHhWA/exec"; 

        // 封裝 Lucide 圖標組件
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name, size, className]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [view, setView] = useState('home'); 
            const [searchQuery, setSearchQuery] = useState(''); 
            const [memberData, setMemberData] = useState(null); 
            const [allMembersData, setAllMembersData] = useState([]); 
            const [accountingData, setAccountingData] = useState([]); 
            const [isLoading, setIsLoading] = useState(false);
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [error, setError] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);
            const [lastSync, setLastSync] = useState(null);

            // 管理員狀態
            const [isAdmin, setIsAdmin] = useState(false);
            const [passwordInput, setPasswordInput] = useState('');
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            // 篩選器狀態
            const [filterCategory, setFilterCategory] = useState('全部');
            const [filterMethod, setFilterMethod] = useState('全部');

            // 表單狀態
            const [formData, setFormData] = useState({
                type: 'accounting',
                date: new Date().toISOString().split('T')[0],
                category: '月助收入',
                description: '',
                amount: '',
                handler: '',
                memberId: '',
                memberName: '',
                year: new Date().getFullYear().toString(),
                month: (new Date().getMonth() + 1).toString(),
                status: '已繳',
                paymentMethod: '現金' 
            });

            const formatDisplayDate = (dateStr) => {
                if (!dateStr || dateStr === '-') return dateStr;
                try {
                    const date = new Date(dateStr);
                    if (isNaN(date.getTime())) return dateStr;
                    return date.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
                } catch (e) { return dateStr; }
            };

            // 匯出 CSV 邏輯
            const downloadCSV = (data, filename) => {
                if (!data || data.length === 0) return;
                const headers = Object.keys(data[0]).join(',');
                const rows = data.map(row => 
                    Object.values(row).map(val => `"${val.toString().replace(/"/g, '""')}"`).join(',')
                ).join('\n');
                
                const csvContent = "\uFEFF" + headers + '\n' + rows; // 加入 BOM 避免 Excel 亂碼
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `${filename}_${new Date().toLocaleDateString()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            useEffect(() => {
                if (view === 'admin_view' || view === 'home' || view === 'admin_yearly') fetchAccounting();
                if (view === 'admin_reports' || view === 'admin_members' || ((view === 'admin_entry' || view === 'admin_yearly') && isAdmin)) {
                    fetchAllMembers();
                }
            }, [view, isAdmin]);

            const fetchAccounting = async () => {
                if (!GAS_WEB_APP_URL) return;
                setIsLoading(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getAccounting`);
                    const result = await response.json();
                    if (result.success) {
                        setAccountingData(result.data);
                        setLastSync(new Date());
                    }
                } catch (err) { setError("讀取流水帳失敗"); }
                finally { setIsLoading(false); }
            };

            const fetchAllMembers = async () => {
                if (!GAS_WEB_APP_URL) return;
                setIsLoading(true);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=getAllMembers`);
                    const result = await response.json();
                    if (result.success) {
                        setAllMembersData(result.data);
                        setLastSync(new Date());
                    }
                } catch (err) { setError("讀取成員列表失敗"); }
                finally { setIsLoading(false); }
            };

            // 提取不重複的成員資訊與貢獻統計
            const memberStats = useMemo(() => {
                const stats = {};
                allMembersData.forEach(m => {
                    if (!m.MemberID) return;
                    if (!stats[m.MemberID]) {
                        stats[m.MemberID] = { 
                            id: m.MemberID, 
                            name: m.Name, 
                            totalPaid: 0, 
                            count: 0,
                            lastPaid: '' 
                        };
                    }
                    if (m.Status === '已繳') {
                        stats[m.MemberID].totalPaid += Number(m.Amount || 0);
                        stats[m.MemberID].count += 1;
                        const dateKey = `${m.Year}/${m.Month}`;
                        if (!stats[m.MemberID].lastPaid || dateKey > stats[m.MemberID].lastPaid) {
                            stats[m.MemberID].lastPaid = dateKey;
                        }
                    }
                });
                return Object.values(stats).sort((a, b) => b.totalPaid - a.totalPaid);
            }, [allMembersData]);

            const uniqueMembers = useMemo(() => {
                return memberStats.map(s => ({ id: s.id, name: s.name }));
            }, [memberStats]);

            const yearlyAnalytics = useMemo(() => {
                const targetYear = Number(selectedYear);
                const monthlyTrend = Array.from({ length: 12 }, (_, i) => ({ month: i + 1, income: 0, expense: 0 }));
                const categories = {};

                accountingData.forEach(item => {
                    const itemDate = new Date(item.Date);
                    if (itemDate.getFullYear() === targetYear) {
                        const monthIdx = itemDate.getMonth();
                        const amt = Number(item.Amount || 0);
                        if (amt > 0) monthlyTrend[monthIdx].income += amt;
                        else monthlyTrend[monthIdx].expense += Math.abs(amt);
                        const cat = item.Category || "其他";
                        categories[cat] = (categories[cat] || 0) + amt;
                    }
                });

                const contributorMap = {};
                allMembersData.forEach(m => {
                    if (Number(m.Year) === targetYear && m.Status === '已繳') {
                        contributorMap[m.Name] = (contributorMap[m.Name] || 0) + 1;
                    }
                });
                const topContributors = Object.entries(contributorMap).sort((a, b) => b[1] - a[1]).slice(0, 5);
                const maxVal = Math.max(...monthlyTrend.map(d => Math.max(d.income, d.expense)), 1000);

                return { monthlyTrend, categories, topContributors, maxVal };
            }, [accountingData, allMembersData, selectedYear]);

            const reportStats = useMemo(() => {
                const monthlyData = {};
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth() + 1;
                const START_YEAR = 2026;
                const START_MONTH = 1;
                
                const paidSet = new Set();
                allMembersData.forEach(m => {
                    if (m.Status === '已繳') {
                        paidSet.add(`${m.MemberID}-${m.Year}-${m.Month}`);
                        const key = `${m.Year}-${m.Month}`;
                        if (!monthlyData[key]) monthlyData[key] = { collected: 0, count: 0 };
                        monthlyData[key].collected += Number(m.Amount || 0);
                        monthlyData[key].count += 1;
                    }
                });

                const autoDetectedUnpaid = [];
                uniqueMembers.forEach(member => {
                    for (let y = START_YEAR; y <= currentYear; y++) {
                        const mStart = (y === START_YEAR) ? START_MONTH : 1;
                        const mEnd = (y === currentYear) ? currentMonth : 12;
                        for (let m = mStart; m <= mEnd; m++) {
                            const checkKey = `${member.id}-${y}-${m}`;
                            if (!paidSet.has(checkKey)) {
                                autoDetectedUnpaid.push({ MemberID: member.id, Name: member.name, Year: y, Month: m, Amount: 500, Reason: "漏繳偵測" });
                            }
                        }
                    }
                });

                return { 
                    monthlyData, 
                    unpaidList: autoDetectedUnpaid.sort((a, b) => (b.Year * 12 + b.Month) - (a.Year * 12 + a.Month)) 
                };
            }, [allMembersData, uniqueMembers]);

            const stats = useMemo(() => {
                const targetYear = Number(selectedYear);
                const filtered = accountingData.filter(item => new Date(item.Date).getFullYear() === targetYear);
                const income = filtered.filter(i => i.Amount > 0).reduce((a, b) => a + Number(b.Amount), 0);
                const expense = filtered.filter(i => i.Amount < 0).reduce((a, b) => a + Math.abs(Number(b.Amount)), 0);
                return { income, expense, balance: income - expense };
            }, [accountingData, selectedYear]);

            const filteredAccounting = useMemo(() => {
                return accountingData.filter(item => {
                    const catMatch = filterCategory === '全部' || item.Category === filterCategory;
                    const methodMatch = filterMethod === '全部' || item.PaymentMethod === filterMethod;
                    return catMatch && methodMatch;
                });
            }, [accountingData, filterCategory, filterMethod]);

            const handleSearch = async () => {
                if (!searchQuery.trim() || !GAS_WEB_APP_URL) return;
                setIsLoading(true);
                setMemberData(null);
                try {
                    const response = await fetch(`${GAS_WEB_APP_URL}?action=queryMember&query=${encodeURIComponent(searchQuery)}`);
                    const result = await response.json();
                    if (result.success) setMemberData(result.data);
                    else setError("查詢失敗");
                } catch (err) { setError("連線錯誤"); }
                finally { setIsLoading(false); }
            };

            const handleAdminLogin = () => {
                if (passwordInput === "1234") { 
                    setIsAdmin(true); 
                    setShowLoginModal(false); 
                    setPasswordInput(''); 
                } else { 
                    setError("密碼錯誤"); 
                }
            };

            const handleSubmitEntry = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    const action = formData.type === 'accounting' ? 'addAccounting' : 'addMemberRecord';
                    await fetch(GAS_WEB_APP_URL, {
                        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, ...formData, password: "1234" })
                    });
                    setSuccessMsg("提交成功");
                    setTimeout(() => { 
                        setSuccessMsg(null); 
                        setView(formData.type === 'accounting' ? 'admin_view' : 'admin_reports'); 
                    }, 2000);
                } catch (err) { setError("提交失敗"); }
                finally { setIsLoading(false); }
            };

            const NavButton = ({ id, label, icon }) => (
                <button 
                    onClick={() => { 
                        if ((id === 'admin_entry' || id === 'admin_yearly' || id === 'admin_members') && !isAdmin) {
                            setShowLoginModal(true);
                        } else {
                            setView(id); 
                            setIsMenuOpen(false); 
                            setError(null); 
                        }
                    }}
                    className={`flex items-center gap-3 px-5 py-3 rounded-2xl transition-all duration-300 font-bold ${
                        view === id ? 'bg-blue-600 text-white shadow-lg shadow-blue-200' : (id === 'admin_entry' || id === 'admin_members') ? 'text-blue-600 bg-blue-50 hover:bg-blue-100' : 'text-slate-500 hover:bg-slate-100'
                    }`}
                >
                    <Icon name={icon} /><span>{label}</span>
                </button>
            );

            return (
                <div className="min-h-screen bg-slate-50 text-slate-900 font-sans selection:bg-blue-100 selection:text-blue-700">
                    
                    {/* 登入 Modal */}
                    {showLoginModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-6">
                            <div className="bg-white rounded-[2rem] p-8 w-full max-w-md shadow-2xl">
                                <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-6">
                                    <Icon name="lock" size={32} />
                                </div>
                                <h3 className="text-2xl font-black mb-2 text-slate-800">管理員授權</h3>
                                <p className="text-slate-500 mb-6 font-medium">存取深度分析與寫入權限需要身分證實。</p>
                                <input 
                                    type="password" autoFocus placeholder="請輸入管理密碼" 
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && handleAdminLogin()}
                                    className="w-full px-6 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-blue-600 outline-none mb-4 font-bold text-lg"
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setShowLoginModal(false)} className="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600">取消</button>
                                    <button onClick={handleAdminLogin} className="flex-1 bg-blue-600 text-white rounded-2xl font-black shadow-xl shadow-blue-100 transition-all hover:bg-blue-700">確認</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 px-6 py-4">
                        <div className="max-w-7xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-blue-600 p-2 rounded-xl text-white">
                                    <Icon name="逢賢icon.png" size={22} />
                                </div>
                                <div class="app-icon-card mx-auto">
                <img src="逢賢icon.png" alt="Logo"
                    onerror="this.src='https://api.dicebear.com/7.x/initials/svg?seed=CY&backgroundColor=6366f1';">
            </div>
                                <span className="font-black text-xl tracking-tight text-slate-800">逢賢帳務<span className="text-blue-600">管理系統</span></span>
                            </div>
                            <div className="hidden lg:flex items-center gap-1">
                                <NavButton id="home" label="總覽" icon="layout" />
                                <NavButton id="member_query" label="月助查詢" icon="search" />
                                <NavButton id="admin_view" label="收支明細" icon="file-text" />
                                <NavButton id="admin_reports" label="自動對帳" icon="history" />
                                <NavButton id="admin_members" label="成員清單" icon="users" />
                                <NavButton id="admin_yearly" label="年度報告" icon="pie-chart" />
                                <div className="w-px h-6 bg-slate-200 mx-2"></div>
                                <NavButton id="admin_entry" label="帳務登錄" icon="plus-circle" />
                            </div>
                            <button className="lg:hidden p-2 text-slate-600" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                <Icon name={isMenuOpen ? "x" : "menu"} size={24} />
                            </button>
                        </div>
                        {isMenuOpen && (
                            <div className="lg:hidden absolute top-full left-0 w-full bg-white border-b border-slate-200 p-6 flex flex-col gap-2 shadow-2xl">
                                <NavButton id="home" label="總覽" icon="layout" />
                                <NavButton id="member_query" label="月助查詢" icon="search" />
                                <NavButton id="admin_view" label="收支明細" icon="file-text" />
                                <NavButton id="admin_reports" label="自動對帳" icon="history" />
                                <NavButton id="admin_members" label="成員管理" icon="users" />
                                <NavButton id="admin_yearly" label="年度報告" icon="pie-chart" />
                                <NavButton id="admin_entry" label="新增紀錄" icon="plus-circle" />
                            </div>
                        )}
                    </nav>

                    <main className="max-w-7xl mx-auto p-4 md:p-8">
                        {successMsg && <div className="mb-6 p-4 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center gap-2 text-emerald-600 font-bold"><Icon name="check-circle" /> {successMsg}</div>}
                        {error && <div className="mb-6 p-4 bg-rose-50 border border-rose-100 rounded-2xl flex items-center justify-between text-rose-600 font-bold shake"><div className="flex items-center gap-2"><Icon name="alert-circle" /> {error}</div><button onClick={() => setError(null)}><Icon name="x" size={18} /></button></div>}
                        
                        {view === 'home' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                <div className="bg-slate-900 rounded-[2.5rem] p-12 text-white shadow-2xl relative overflow-hidden group">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-blue-600/20 rounded-full -mr-20 -mt-20 blur-3xl group-hover:bg-blue-600/30 transition-all duration-700"></div>
                                    <div className="relative z-10 flex flex-col md:flex-row justify-between items-center gap-8">
                                        <div>
                                            <p className="text-slate-400 mb-2 font-bold uppercase tracking-widest">{selectedYear} 年度累計結餘</p>
                                            <h2 className="text-7xl font-black tabular-nums tracking-tighter">
                                                <span className="text-3xl font-normal text-slate-500 mr-2">$</span>
                                                {stats.balance.toLocaleString()}
                                            </h2>
                                        </div>
                                        <div className="grid grid-cols-2 gap-4 w-full md:w-auto">
                                            <div className="bg-white/5 p-6 rounded-3xl border border-white/10 backdrop-blur-sm">
                                                <p className="text-emerald-400 text-xs font-black uppercase mb-1 flex items-center gap-1"><Icon name="arrow-up-right" size={12}/> 總收入</p>
                                                <p className="text-3xl font-black text-white">+{stats.income.toLocaleString()}</p>
                                            </div>
                                            <div className="bg-white/5 p-6 rounded-3xl border border-white/10 backdrop-blur-sm">
                                                <p className="text-rose-400 text-xs font-black uppercase mb-1 flex items-center gap-1"><Icon name="arrow-down-left" size={12}/> 總支出</p>
                                                <p className="text-3xl font-black text-white">-{stats.expense.toLocaleString()}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <div onClick={() => setView('member_query')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-blue-500 cursor-pointer shadow-sm transition-all hover:-translate-y-1"><Icon name="search" size={32} className="mb-4 text-blue-600"/><h3 className="font-black text-xl mb-2 text-slate-800">個人查詢</h3><p className="text-slate-500 text-sm">輸入姓名或 ID 查詢年度繳費狀況。</p></div>
                                    <div onClick={() => setView('admin_reports')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-rose-500 cursor-pointer shadow-sm transition-all hover:-translate-y-1"><Icon name="history" size={32} className="mb-4 text-rose-600"/><h3 className="font-black text-xl mb-2 text-slate-800">自動對帳</h3><p className="text-slate-500 text-sm">智能偵測漏繳月份與待補金額。</p></div>
                                    <div onClick={() => setView('admin_members')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-indigo-500 cursor-pointer shadow-sm transition-all hover:-translate-y-1"><Icon name="users" size={32} className="mb-4 text-indigo-600"/><h3 className="font-black text-xl mb-2 text-slate-800">成員管理</h3><p className="text-slate-500 text-sm">查看所有成員的歷史貢獻總額。</p></div>
                                    <div onClick={() => setView('admin_yearly')} className="bg-white p-8 rounded-[2rem] border border-slate-200 hover:border-amber-500 cursor-pointer shadow-sm transition-all hover:-translate-y-1"><Icon name="pie-chart" size={32} className="mb-4 text-amber-600"/><h3 className="font-black text-xl mb-2 text-slate-800">年度分析</h3><p className="text-slate-500 text-sm">全年度資金趨勢與類別圓餅圖。</p></div>
                                </div>
                            </div>
                        )}

                        {view === 'admin_view' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-8">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                                    <div><h2 className="text-4xl font-black text-slate-800">收支明細</h2><p className="text-slate-500 font-medium">記錄每一筆公開透明的資金流向</p></div>
                                    <div className="flex gap-2 w-full md:w-auto">
                                        <button onClick={() => downloadCSV(accountingData, 'TeamAccounting')} className="flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50 transition-all shadow-sm">
                                            <Icon name="download" size={16}/> 匯出報表
                                        </button>
                                        <button onClick={fetchAccounting} className="p-3 bg-white border border-slate-200 rounded-xl hover:bg-slate-50 transition-all shadow-sm">
                                            <Icon name="refresh-ccw" className={isLoading ? 'animate-spin text-blue-600' : 'text-slate-600'} />
                                        </button>
                                    </div>
                                </div>

                                {/* 篩選區 */}
                                <div className="bg-white p-4 rounded-3xl border border-slate-200 flex flex-wrap gap-4 items-center">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-black text-slate-400 uppercase ml-2">類別</span>
                                        <select value={filterCategory} onChange={(e)=>setFilterCategory(e.target.value)} className="bg-slate-50 px-3 py-2 rounded-xl text-sm font-bold border-none outline-none focus:ring-2 focus:ring-blue-600">
                                            <option>全部</option><option>月助收入</option><option>個人了愿</option><option>外部捐款</option><option>行政支出</option><option>活動支出</option>
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs font-black text-slate-400 uppercase ml-2">管道</span>
                                        <select value={filterMethod} onChange={(e)=>setFilterMethod(e.target.value)} className="bg-slate-50 px-3 py-2 rounded-xl text-sm font-bold border-none outline-none focus:ring-2 focus:ring-blue-600">

                                                <div className="space-y-2">
                                                    <label className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">姓名</label>
                                                    <input type="text" placeholder="姓名" required value={formData.memberName} onChange={(e)=>setFormData({...formData,memberName:e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-600 transition-all shadow-inner" readOnly={formData.memberId!=='NEW'}/>
                                                </div>
                                            </div>
                                        )}
                                        <div className="space-y-2">
                                            <label className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">細目說明</label>
                                            <input type="text" placeholder="例：三月份場地維護費" required value={formData.description} onChange={(e)=>setFormData({...formData,description:e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-600 transition-all shadow-inner" />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div className="space-y-2">
                                                <label className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">入帳金額 (支出請填負數)</label>
                                                <input type="number" placeholder="金額" required value={formData.amount} onChange={(e)=>setFormData({...formData,amount:e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-black text-2xl outline-none border-2 border-transparent focus:border-blue-600 transition-all shadow-inner" />
                                            </div>
                                            <div className="space-y-2">
                                                <label className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">繳費/支付方式</label>
                                                <select value={formData.paymentMethod} onChange={(e)=>setFormData({...formData, paymentMethod: e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-600 transition-all shadow-inner"><option>現金</option><option>郵局</option><option>轉帳</option><option>LinePay</option></select>
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">經手人簽章</label>
                                            <input type="text" placeholder="簽署經手人姓名" required value={formData.handler} onChange={(e)=>setFormData({...formData,handler:e.target.value})} className="w-full px-6 py-4 bg-slate-50 rounded-2xl font-bold outline-none border-2 border-transparent focus:border-blue-600 transition-all shadow-inner" />
                                        </div>
                                        <button type="submit" disabled={isLoading} className="w-full bg-blue-600 text-white py-6 rounded-3xl font-black text-2xl shadow-2xl shadow-blue-100 hover:bg-blue-700 transition-all active:scale-[0.98] disabled:opacity-50">
                                            {isLoading ? <Icon name="refresh-ccw" className="animate-spin inline-block mr-2"/> : <Icon name="save" className="inline-block mr-2"/>}
                                            {isLoading ? "正在同步中..." : "確認儲存並存入雲端"}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* 頁尾同步資訊 */}
                    <footer className="mt-20 py-16 border-t border-slate-200 text-center text-slate-400">
                        <div className="flex items-center justify-center gap-2 mb-4 opacity-50">
                            <Icon name="refresh-cw" size={14} className={isLoading ? 'animate-spin' : ''}/>
                            <span className="text-[10px] font-black uppercase tracking-widest">
                                {lastSync ? `最後同步於: ${lastSync.toLocaleTimeString()}` : '尚未連線'}
                            </span>
                        </div>
                        <p className="text-xs font-bold uppercase tracking-widest">© 2026 逢賢財務系統</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
